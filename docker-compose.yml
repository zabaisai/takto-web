# =====================================================================
# TAKTO · web comercial
#
# Servicio AISLADO. No comparte red, volúmenes ni dependencias con el CRM.
# No declara base de datos: la landing no tiene estado.
#
# El puerto se publica SOLO en loopback, para diagnóstico desde el propio
# host. Hacia fuera solo se llega por Caddy. No se abre ningún puerto a
# internet.
#
# Caddy corre dentro de un contenedor, así que NO puede alcanzar el
# loopback del host: se comprobó en el servidor. Por eso el servicio se une
# además a la red de borde del CRM (`tehus-crm-staging_proxy`), donde ya
# están caddy, frontend y backend, y Caddy lo resuelve como `takto-web:3000`.
#
# NO se une a `tehus-crm-staging_internal`, que es la única red donde vive
# PostgreSQL. Sin volúmenes compartidos, sin base de datos, sin variables
# del CRM.
# =====================================================================

# Nombre de proyecto explícito: sin esto Compose lo deduce del directorio,
# que en este equipo es `tehus-crm-web`. Fijarlo evita crear un proyecto con
# el nombre viejo al desplegar.
name: takto-web

services:
  takto-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://takto.online}
        NEXT_PUBLIC_CRM_LOGIN_URL: ${NEXT_PUBLIC_CRM_LOGIN_URL:-https://crm-staging.tehusrattan.com/login}
        NEXT_PUBLIC_CRM_ONBOARDING_URL: ${NEXT_PUBLIC_CRM_ONBOARDING_URL:-https://crm-staging.tehusrattan.com/onboarding}
        NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-true}
    image: takto-web:latest
    container_name: takto-web
    restart: unless-stopped

    networks:
      - edge

    # Solo loopback: para `curl 127.0.0.1:3100` en el smoke test del host.
    # 3100 verificado libre en el servidor (ss -ltn) y sin colisión con el
    # CRM, la API, PostgreSQL, pgAdmin ni Caddy.
    ports:
      - "127.0.0.1:3100:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Destino del formulario. `log` no envía ni almacena nada.
      DEMO_LEAD_SINK: ${DEMO_LEAD_SINK:-log}
      DEMO_RATE_LIMIT_MAX: ${DEMO_RATE_LIMIT_MAX:-5}
      DEMO_RATE_LIMIT_WINDOW_MS: ${DEMO_RATE_LIMIT_WINDOW_MS:-600000}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Límites conservadores: la landing es estática y consume muy poco.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

# La red de borde ya existe: la crea el stack del CRM. Se declara `external`
# para NO gestionarla desde aquí — este compose nunca la crea ni la borra.
# Sobrescribible con TAKTO_EDGE_NETWORK si el stack del CRM cambia de nombre.
networks:
  edge:
    external: true
    name: ${TAKTO_EDGE_NETWORK:-tehus-crm-staging_proxy}
